[loggers]
keys=root

[handlers]
keys=consoleHandler

[formatters]
keys=standardFormatter

[logger_root]
level=INFO
handlers=consoleHandler

[handler_consoleHandler]
class=StreamHandler
level=NOTSET
formatter=standardFormatter
args=(sys.stderr,)

[formatter_standardFormatter]
format=%(asctime)s %(levelname)s %(name)s %(filename)s:%(lineno)d [%(funcName)s] %(message)s
